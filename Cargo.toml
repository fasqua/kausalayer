[package]
name = "kausalayer"
version = "0.1.0"
edition = "2021"
description = "Private Transfer on Solana - Stealth Diffusion Protocol"
license = "MIT"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
ed25519-dalek = "1.0"
sha2 = "0.10"
rand = "0.7"
bs58 = "0.5"
hex = "0.4"
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rpassword = "7.3"

# Directory handling
dirs = "5.0"
solana-transaction-status = "1.18"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "kausalayer"
path = "src/main.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[[bin]]
name = "scanner"
path = "src/bin/scanner.rs"

[[bin]]
name = "devnet_test"
path = "src/bin/devnet_test.rs"

[[bin]]
name = "devnet_send_test"
path = "src/bin/devnet_send_test.rs"

[[bin]]
name = "claim_test"
path = "src/bin/claim_test.rs"

[[bin]]
name = "check_solana_crypto"
path = "src/bin/check_solana_crypto.rs"

[[bin]]
name = "devnet_full_test"
path = "src/bin/devnet_full_test.rs"

[[bin]]
name = "scanner_test"
path = "src/bin/scanner_test.rs"
